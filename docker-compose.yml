services:
  api:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    # Development only: reload on code changes. The image itself (and the production compose file) never reloads.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--proxy-headers"]
    # Development only: bind-mounted source/media from Windows or Linux hosts must stay writable. Production runs non-root.
    user: "0:0"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: /code
    volumes:
      - ./app:/code/app
      - ./tests:/code/tests
      - ./alembic:/code/alembic
      - ./alembic.ini:/code/alembic.ini
      - ./scripts:/code/scripts
      - ./media:/code/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Runs the background jobs: payment-confirmation emails, refund execution, and the SCHEDULED order
  # expiry sweep. Without it, unpaid orders never expire and refunds are never sent to the provider.
  worker:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    command: python -m scripts.run_worker
    user: "0:0"  # development only, see the api service
    healthcheck:
      disable: true  # the worker serves no HTTP (the image's health check is for the API)
    env_file:
      - .env
    environment:
      PYTHONPATH: /code
    volumes:
      - ./app:/code/app
      - ./scripts:/code/scripts
      - ./media:/code/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: fastapi_ecommerce_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  test_db:
    image: postgres:16-alpine
    container_name: fastapi_ecommerce_test_db
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TEST_POSTGRES_DB}
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${TEST_POSTGRES_USER} -d $${TEST_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fastapi_ecommerce_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: fastapi_ecommerce_adminer
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: