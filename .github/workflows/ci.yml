name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock

      - run: pip install ruff

      - run: ruff check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest

    # Same two backing services docker-compose.yml runs locally.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: shop_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d shop_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Throwaway values: CI never touches real credentials. Settings
    # requires all of these to exist, even though tests override the DB
    # session and mock Stripe.
    env:
      ENVIRONMENT: testing
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/shop_test_db
      TEST_DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/shop_test_db
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock

      # Exactly the versions in uv.lock (the lockfile is the single source of truth), never "whatever is newest today".
      - name: Install locked dependencies
        run: |
          pip install uv
          uv export --locked --extra dev --no-emit-project --no-hashes -o requirements-ci.txt
          pip install -r requirements-ci.txt
          pip install --no-deps -e .

      - run: pytest -q

  migrations:
    name: Migrations (alembic)
    runs-on: ubuntu-latest

    # A dedicated, empty database. The pytest job builds its schema with
    # Base.metadata.create_all and never runs a migration, so without this
    # job a broken or missing migration would only be discovered at deploy.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: shop_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d shop_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Throwaway values, same idea as the test job. Alembic's env.py reads
    # DATABASE_URL through the app Settings, which also require the rest.
    env:
      ENVIRONMENT: testing
      DATABASE_URL: postgresql+asyncpg://ci_user:ci_password@localhost:5432/shop_migrations
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock

      # Exactly the versions in uv.lock (the lockfile is the single source of truth), never "whatever is newest today".
      - name: Install locked dependencies
        run: |
          pip install uv
          uv export --locked --extra dev --no-emit-project --no-hashes -o requirements-ci.txt
          pip install -r requirements-ci.txt
          pip install --no-deps -e .

      # Replays every migration from an empty database. Fails on a broken
      # migration, a wrong down_revision, or multiple heads (two branches
      # merged without an `alembic merge`).
      - name: Apply all migrations
        run: alembic upgrade head

      # A single head: two branches merged without `alembic merge` would leave `upgrade head` ambiguous.
      - name: Exactly one migration head
        run: test "$(alembic heads | grep -c '(head)')" = "1"

      # Fails if the models and the migrated schema disagree: a column,
      # index or constraint changed in a model without a new migration
      # (or the reverse). The fix is `alembic revision --autogenerate`.
      - name: Check models match migrations
        run: alembic check

      # alembic check ignores CHECK / EXCLUDE constraints. This catches a constraint
      # declared in a model that no migration creates. The two XOR constraints are a
      - name: Check named constraints exist in the migrated database
        run: >-
          python -m scripts.check_schema_constraints

      # Downgrades are a development convenience, but a broken one hides a broken migration (a native enum left behind made
      # the next upgrade fail). On this EMPTY database a full downgrade must work and the schema must come back identical.
      - name: Downgrade to base and upgrade again
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic check
          python -m scripts.check_schema_constraints

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock

      - run: pip install pip-audit uv

      # The lockfile must match pyproject.toml, or the audited set is not the installed set.
      - name: Lockfile is up to date
        run: uv lock --check

      # Audits the EXACT versions the production image installs (uv.lock, without dev tools). Fails the build on any known
      # vulnerability. There are no ignores: python-jose and ecdsa, which needed two, are gone.
      - name: Audit the locked production dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes -o requirements-prod.txt
          pip-audit -r requirements-prod.txt --no-deps --disable-pip
